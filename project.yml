name: Klick
options:
  bundleIdPrefix: io.exastudio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES

targets:
  WebP:
    type: library.static
    platform: macOS
    sources:
      - path: Vendor/libwebp/src
      - path: Vendor/libwebp/sharpyuv
    settings:
      base:
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/libwebp
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        CLANG_ENABLE_MODULES: NO
        SKIP_INSTALL: YES

  # LAME MP3 encoder (LGPL-2.0). Built as its own dynamic framework, embedded in
  # Contents/Frameworks, so it stays dynamically linked (and replaceable) in the MIT app.
  LAME:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/lame/libmp3lame
        headerVisibility: project
    settings:
      base:
        PRODUCT_NAME: LAME
        PRODUCT_BUNDLE_IDENTIFIER: io.exastudio.klick.lame
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "3.100"
        DYLIB_CURRENT_VERSION: "3.100"
        DYLIB_COMPATIBILITY_VERSION: "1"
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/lame $(SRCROOT)/Vendor/lame/include $(SRCROOT)/Vendor/lame/libmp3lame
        GCC_PREPROCESSOR_DEFINITIONS: HAVE_CONFIG_H=1 NDEBUG=1 # never DEBUG: LAME prints its internals then
        GCC_OPTIMIZATION_LEVEL: "3" # vendored encoder: optimized in Debug builds too
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        CLANG_ENABLE_MODULES: NO
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES

  Klick:
    type: application
    platform: macOS
    sources:
      - path: Klick
    dependencies:
      - target: WebP
      - target: LAME
        embed: true
        codeSign: true
    info:
      path: Klick/Resources/Info.plist
      properties:
        CFBundleName: Klick
        CFBundleDisplayName: Klick
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Giovanni D'Andrea. Released under the MIT License."
        NSAppleEventsUsageDescription: "Klick reads the files you have selected in Finder so it can show the right actions in the wheel."
    entitlements:
      path: Klick/Resources/Klick.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        # Ad-hoc signatures carry no Team ID, so the hardened runtime's library validation
        # rejects the embedded LAME.framework. Can go once the app is signed with a Developer ID.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.exastudio.klick
        PRODUCT_NAME: Klick
        SWIFT_OBJC_BRIDGING_HEADER: Klick/Support/Klick-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/libwebp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
